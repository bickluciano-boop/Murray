apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'app.ojoguard.sostrigger'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()
useExpoPublishing()

android {
  namespace "expo.modules.sostrigger"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Igual que theft-detection y exact-alarm: useCoreDependencies() no expone HeadlessJsTaskService
  // ni Arguments, hace falta declararlo acá directamente.
  implementation "com.facebook.react:react-android"
}
